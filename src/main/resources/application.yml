spring:
  application:
    name: cartflow-backend


  profiles:
    active: dev


  datasource:
    url: jdbc:mysql://localhost:3306/cartflow_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver


  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  password-reset:
    token-expiration-ms: 900000
  upload:
    dir: uploads/products
  order:
    tax-rate: 0.05
    shipping-charge: 50.00

