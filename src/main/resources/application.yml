spring:
  application:
    name: cartflow-backend


  profiles:
    active: dev


  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cartflow_dev}?useSSL=${DB_USE_SSL:false}&requireSSL=${DB_USE_SSL:false}&verifyServerCertificate=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver


  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_USE_SSL:false}
      timeout: 60000

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  server:
    port: ${PORT:8080}

  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: ${MAILTRAP_USERNAME}
    password: ${MAILTRAP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  password-reset:
    token-expiration-ms: 900000
  order:
    tax-rate: 0.05
    shipping-charge: 50.00
  mail:
    from: noreply@cartflow.com
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}


cache:
  type: redis



cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}


